# Sequential MNIST experiment configuration.
dataset: sMNIST
experiment_name: smnist
num_runs: 1
seed: 42
device: auto
data_root: ./data
logs_root: ./logs

batch_size: 256
time_window: 8
spat_ds_fac: 1.0
num_crop_pixel: 0
seq_len: 784
padding_size: 784
slice_input_by_amount: false
num_slices: 1
include_zero_slice: false
slicing_thrs: [0.5]
slicing_thrs_maxs: null
aug_og_data: false
aug_kwargs: null
denoise_data: false
denoise_mode: tonic
task_type: null
jitter_level: none
dropout_level: none
poisson_level: none
permute_data: false
permutation_seed: null

rewiring: true
supervised: true
continue_rewiring_from_checkpoint: false
continue_supervised_from_checkpoint: false
load_checkpoint_folder: null
num_searching_units: 8500
thr_factor: 30
thr_low: -90
thr_high: 450
penalty_fac: 2.0
class_selectivity_threshold: 0.09
selectivity_gap_to_other_classes: 0.03
experiment_mode: std

num_hidden_layer: 1
num_hidden_units: 1500
num_spines: 5
min_num_spines: 5
max_seq_len: null
spike_acceptance_window: 0
parallel_sequences: true
refrac_period: false
output_bias: false
output_decoder: max
lr: 0.001
lr_scheduled: false
lr_decay: 15
lr_update_freq: 5
l2_regu: 0
dropout: 0.0
num_workers: 2
max_rewiring_epochs: 10000000
max_supervised_epochs: 1000000
early_stopping_patience: 30
pruning_level: 0.7
bit_width: 8
